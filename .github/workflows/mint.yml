name: mint-oidc
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        run: |
          set -euo pipefail
          aud="api://AzureADTokenExchange"
          encaud=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$aud")
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$encaud")
          printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])" > /tmp/oidc.jwt
          cut -d. -f2 /tmp/oidc.jwt | python3 -c "import sys,base64,json;p=sys.stdin.read().strip();p+='='*(-len(p)%4);json.dump(json.loads(base64.urlsafe_b64decode(p)),open('/tmp/oidc.claims.json','w'),indent=1)"
          wc -c /tmp/oidc.jwt
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-jwt
          path: |
            /tmp/oidc.jwt
            /tmp/oidc.claims.json
          retention-days: 7
